
<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bierpong Aufgabe</title>
  <style>
    body {
      font-family: 'Arial', sans-serif;
      background-color: #1e1e1e;
      color: #fff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
    }
    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
      color: #ffcc00;
    }
    .slot {
      font-size: 2rem;
      background-color: #333;
      padding: 1rem 2rem;
      border-radius: 1rem;
      border: 2px solid #ffcc00;
      margin: 2rem 0;
      min-height: 60px;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    button {
      background-color: #ffcc00;
      border: none;
      padding: 1rem 2rem;
      border-radius: 0.5rem;
      font-size: 1rem;
      cursor: pointer;
      transition: background-color 0.3s ease;
    }
    button:hover {
      background-color: #e6b800;
    }
  </style>
</head>
<body>
  <h1>Bierpong Aufgabe</h1>
  <div class="slot" id="slot">Bereit?</div>
  <button onclick="startSlot()">Aufgabe starten</button>

  <script>
    const aufgaben = ['Trinke 2 Schlucke.', 'Du darfst eine Runde aussetzen.', 'Sprich mit französischem Akzent.', 'Der nächste Wurf entscheidet doppelt.', 'Sag „Prost“ auf 3 verschiedene Sprachen.', 'Tu so, als wärst du der Schiri.', 'Wirf den nächsten Ball mit der „falschen“ Hand.', 'Der nächste Treffer zählt doppelt – aber du trinkst mit.', 'Mach einen Becher-Shuffle (Vertausche 2).', 'Dein nächster Wurf ist ein Trickshot!', 'Nächster Wurf zählt doppelt', 'Wirf mit geschlossenen Augen',
                     'Rückwärts werfen','Bounce-Wurf','Wirf über die Schulter','Wirf mit der schwachen Hand','Seitentausch', 'Team-Wurf', 'Jeder trinkt bevor der nächste Wurf kommt', 'Wer nicht trifft, muss einen Schluck nehmen', 'Eigene Becher dürfen verschoben werden', 'Ein eigener Becher wird entfernt', 'Ein Becher der anderen wird entfernt', 'Ein eigener Becher wird wieder aufgefüllt', 'Ein Becher der anderen wird wieder aufgefüllt', 'Nächster Treffer gewinnt', 'Nur die äußeren Becher zählen', 
                     'Nur die mittleren Becher zählen', 'Nur die hinterste Reihe zählt', 'Nur der mittlere Becher zählt', 'Würfel entscheidet wie viele Becher beim nächsten Treffer entfernt werden', 'Jeder in der vorherigen Runde getroffene Becher wird wieder aufgefüllt'];
    let interval;
    function startSlot() {
      let i = 0;
      const slot = document.getElementById('slot');
      clearInterval(interval);
      interval = setInterval(() => {
        const random = aufgaben[Math.floor(Math.random() * aufgaben.length)];
        slot.textContent = random;
        i++;
        if (i > 20) {
          clearInterval(interval);
        }
      }, 100);
    }
  </script>
</body>
</html>
